version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: sellerbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sellerbot
      POSTGRES_USER: sellerbot_user
      POSTGRES_PASSWORD: sellerbot_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
