version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: sellerbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sellerbot
      POSTGRES_USER: sellerbot_user
      POSTGRES_PASSWORD: sellerbot_pass
    ports:
      - "5432:5432"
    # ВАЖНО: В тестовой среде volume отключён, база будет пересоздаваться при каждом запуске!
    # Для продакшена обязательно раскомментировать volume ниже!
    # volumes:
    #   - pgdata:/var/lib/postgresql/data
# volumes:
#   pgdata:
