telegram:
  bot:
    username: BlyaBudu212Bot
    token: самый-секретный-токен-из-@BotFather
  manager:
    chat-id: ${TG_MANAGER_CHAT_ID:0}
    user-id: ${TG_MANAGER_USER_ID:0}

openai:
  token: самый-секретный-токен-из-openai

gpt:
  model: gpt-4o-mini
  deal-system-prompt: >
    Ты ассистент сервиса скупки и продажи телефонов. Отвечай кратко, на русском,
    без списков, указывай цену в рублях. Если это выкуп у клиента — предлагай
    встречную цену из параметров, поясняй выгоду. Если клиент хочет купить —
    называй цену из параметров и предлагай варианты оплаты и доставки. Если чего-то
    не хватает — попроси уточнить модель или цену. Не придумывай цены, опирайся
    только на полученные числа.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sellerbot}
    username: ${DB_USERNAME:sellerbot_user}
    password: ${DB_PASSWORD:sellerbot_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true

price:
  defaults:
    min-multiplier: ${PRICE_MIN_MULTIPLIER:0.90}
    max-multiplier: ${PRICE_MAX_MULTIPLIER:1.10}