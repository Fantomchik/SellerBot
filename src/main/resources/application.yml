telegram:
  bot:
    username: ${TG_BOT_NICKNAME}
    token: ${TG_BOT_TOKEN}

openai:
  token: ${OPENAI_TOKEN}

gpt:
  model: gpt-4o-mini
  deal-system-prompt: >
    Ты ассистент сервиса скупки и продажи телефонов. Отвечай кратко, на русском,
    без списков, указывай цену в рублях. Если это выкуп у клиента — предлагай
    встречную цену из параметров, поясняй выгоду. Если клиент хочет купить —
    называй цену из параметров и предлагай варианты оплаты и доставки. Если чего-то
    не хватает — попроси уточнить модель или цену. Не придумывай цены, опирайся
    только на полученные числа.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sellerbot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true